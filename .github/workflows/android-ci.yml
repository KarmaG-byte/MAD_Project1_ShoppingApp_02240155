name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply customer sign-out option
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt')
          s = p.read_text()
          old_call = 'if (screen in listOf(Screen.Home, Screen.Explore, Screen.Bookings)) CustomerBottomBar(screen, bookings.size) { screen = it }'
          new_call = 'if (screen in listOf(Screen.Home, Screen.Explore, Screen.Bookings)) CustomerBottomBar(screen, bookings.size, { screen = it }, ::signOut)'
          old_sig = 'private fun CustomerBottomBar(current: Screen, count: Int, navigate: (Screen) -> Unit) {'
          new_sig = 'private fun CustomerBottomBar(current: Screen, count: Int, navigate: (Screen) -> Unit, signOut: () -> Unit) {'
          old_end = '''        listOf(Triple(Screen.Home, Icons.Outlined.Home, "Home"), Triple(Screen.Explore, Icons.Outlined.Search, "Explore"), Triple(Screen.Bookings, Icons.Outlined.ConfirmationNumber, "Bookings")).forEach { (s, i, l) ->
            NavigationBarItem(current == s, { navigate(s) }, { BadgedBox(badge = { if (s == Screen.Bookings && count > 0) Badge { Text(count.toString()) } }) { Icon(i, l) } }, label = { Text(l) })
        }
    }
}'''
          new_end = '''        listOf(Triple(Screen.Home, Icons.Outlined.Home, "Home"), Triple(Screen.Explore, Icons.Outlined.Search, "Explore"), Triple(Screen.Bookings, Icons.Outlined.ConfirmationNumber, "Bookings")).forEach { (s, i, l) ->
            NavigationBarItem(current == s, { navigate(s) }, { BadgedBox(badge = { if (s == Screen.Bookings && count > 0) Badge { Text(count.toString()) } }) { Icon(i, l) } }, label = { Text(l) })
        }
        NavigationBarItem(false, signOut, { Icon(Icons.Outlined.Logout, "Sign out") }, label = { Text("Sign out") })
    }
}'''
          changed = False
          if old_call in s:
              s = s.replace(old_call, new_call, 1); changed = True
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1); changed = True
          if old_end in s:
              s = s.replace(old_end, new_end, 1); changed = True
          if changed:
              p.write_text(s)
          PY
          if ! git diff --quiet -- app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt
            git commit -m "Add customer sign-out option"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "tshongla-ci-placeholder",
              "storage_bucket": "tshongla-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                "android_client_info": { "package_name": "com.karmagbyte.tshongla" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyCIPlaceholderKeyNotUsedAtRuntime" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug app
        run: ./gradlew assembleDebug --stacktrace
