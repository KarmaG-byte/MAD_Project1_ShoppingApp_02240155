name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final TshongLa logo inside app
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt')
          s = p.read_text()
          old = '        Surface(shape = CircleShape, color = Wine, modifier = Modifier.size(76.dp)) { Box(contentAlignment = Alignment.Center) { Text("T", color = Color.White, fontSize = 34.sp, fontWeight = FontWeight.ExtraBold) } }'
          new = '''        Surface(shape = RoundedCornerShape(24.dp), color = Color.Transparent, modifier = Modifier.size(112.dp)) {
            androidx.compose.foundation.Image(
                painter = androidx.compose.ui.res.painterResource(R.drawable.ic_launcher),
                contentDescription = "TshongLa logo",
                modifier = Modifier.fillMaxSize()
            )
        }'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

          if ! git diff --quiet -- app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt
            git commit -m "Use final TshongLa logo inside app"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is intentionally not committed. CI only needs a
      # structurally valid placeholder to compile the Android project; the real
      # Firebase configuration remains local in Android Studio.
      - name: Create CI Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "tshongla-ci-placeholder",
              "storage_bucket": "tshongla-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.karmagbyte.tshongla"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyCIPlaceholderKeyNotUsedAtRuntime" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug app
        run: ./gradlew assembleDebug --stacktrace
