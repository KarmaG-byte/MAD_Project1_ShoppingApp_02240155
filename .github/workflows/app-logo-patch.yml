name: Apply in-app TshongLa logo

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/app-logo-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholder logo
        run: |
          sed -i '278c\        androidx.compose.foundation.Image(painter = androidx.compose.ui.res.painterResource(R.drawable.ic_launcher), contentDescription = "TshongLa logo", modifier = Modifier.size(112.dp))' app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/karmagbyte/tshongla/MainActivity.kt
          git commit -m "Use final TshongLa logo inside app"
          git push
